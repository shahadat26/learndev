# =============================================================================
# Continuous integration.
#
# Four jobs, each answering a different question:
#   quality  - does each project lint, format, test and build, and does its
#              committed migration still match its schema? (matrix over the three)
#   compose  - is the compose stack still a valid, resolvable definition?
#   images   - does each Dockerfile still produce an image? (build only, no push)
#   stack    - does the whole system actually come up and serve traffic?
#
# Nothing is pushed anywhere. `quality` starts no database - the unit and e2e
# specs mock PrismaService - while `stack` starts the real one, through compose,
# exactly as a laptop does.
#
# Stage 3 of docs/devops-roadmap.md turns `images` into a build-and-push job.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  # ---------------------------------------------------------------------------
  # Lint + test + build, once per project, in parallel.
  # fail-fast: false so one red project still reports the other two.
  # ---------------------------------------------------------------------------
  quality:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project:
          - account-service
          - product-service
          - frontend
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      # `ci` not `install`: fails on a lockfile that disagrees with package.json,
      # and never mutates the lockfile.
      - name: Install dependencies
        run: npm ci

      # Prisma resolves env("DATABASE_URL") at generate time, and the Next build
      # validates its own config, so give every project its committed defaults.
      # No secrets: these are the same placeholders as .env.example.
      - name: Provide placeholder environment
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Generate Prisma client
        if: matrix.project != 'frontend'
        run: npx prisma generate

      # The highest-value gate in this file, because it is the one nothing else
      # covers. There is no database here, so prisma/migrations/0_init/migration.sql
      # is maintained BY HAND alongside prisma/schema.prisma. Add a column to the
      # schema and forget the migration and every other check below stays green -
      # lint, tests, build, image, compose config - and the only failure is
      # `prisma migrate deploy` blowing up at container start, in production shape.
      #
      # So regenerate the migration from the schema and require a match.
      # `--from-empty` rather than `--from-migrations`: replaying the migrations
      # folder needs a shadow database to replay INTO, and this job has no server.
      #
      # The `$(cat ...)` round-trip compares CONTENT, not bytes: command
      # substitution strips trailing newlines from both sides and `printf` puts
      # exactly one back. `migrate diff --script` ends its output with a blank
      # line, and whether a committed file kept that blank line depends on the
      # editor that last saved it - today product-service has it and
      # account-service does not, and neither is a drift worth failing a build
      # for. Nothing else about either file is normalised, so a real change -
      # one added column, one renamed index - still fails this step.
      - name: Check the committed migration still matches the schema
        if: matrix.project != 'frontend'
        run: |
          npx prisma migrate diff \
            --from-empty \
            --to-schema-datamodel prisma/schema.prisma \
            --script > "$RUNNER_TEMP/expected-migration.sql"
          if ! diff -u \
            <(printf '%s\n' "$(cat prisma/migrations/0_init/migration.sql)") \
            <(printf '%s\n' "$(cat "$RUNNER_TEMP/expected-migration.sql")"); then
            echo "::error file=${{ matrix.project }}/prisma/migrations/0_init/migration.sql::Schema and migration have drifted. The diff above is committed-vs-regenerated; copy the regenerated SQL over the migration, or fix the schema."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      # A committed Prettier script that CI never runs is one the repository
      # slowly drifts away from. `npm run format` fixes what this reports.
      - name: Check formatting
        run: npm run format:check

      # Green here means different things per project, so do not read more into
      # it than it says: the two Nest services run Jest unit specs against a
      # mocked PrismaService, while `frontend`'s `test` script is
      # `tsc --noEmit` followed by node's built-in runner over `src/**/*.test.ts`
      # - which covers the pure helpers in src/lib only. Nothing here renders a
      # component or opens a socket; that is a roadmap stage-2 exercise.
      # No `-- --ci` flag: Actions already exports CI=true, which Jest detects on
      # its own, and npm mis-expands a bare `--ci` into its own `--cidr` option.
      - name: Typecheck / unit tests
        run: npm run test --if-present

      - name: End-to-end tests (mocked Prisma, no database)
        run: npm run test:e2e --if-present

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # The compose files are code too. This catches a typo'd label, an undefined
  # ${VAR}, or a service pointing at a network that no longer exists - without
  # ever pulling an image.
  # ---------------------------------------------------------------------------
  compose:
    name: compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Materialise .env from the committed template
        run: cp .env.example .env

      - name: Validate the production stack
        run: docker compose config -q

      - name: Validate the production stack + dev override
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q

      - name: Assert nothing but Traefik publishes a host port
        run: |
          published=$(docker compose config --format json \
            | jq -r '.services | to_entries[] | select(.value.ports != null) | .key')
          echo "Services publishing host ports: ${published:-<none>}"
          if [ "$published" != "traefik" ]; then
            echo "::error::docker-compose.yml must publish host ports for traefik only"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Build each image with buildx, caching layers in the GitHub Actions cache.
  # `push: false` - stage 3 of the roadmap adds a registry, tags and provenance.
  # ---------------------------------------------------------------------------
  images:
    name: image ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [quality, compose]
    strategy:
      fail-fast: false
      matrix:
        project:
          - account-service
          - product-service
          - frontend
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.project }} image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.project }}
          file: ./${{ matrix.project }}/Dockerfile
          push: false
          load: false
          tags: learndev/${{ matrix.project }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.project }}
          cache-to: type=gha,mode=max,scope=${{ matrix.project }}

  # ---------------------------------------------------------------------------
  # The only job that actually STARTS the system. Everything above proves the
  # pieces are well formed; this proves they fit together - the healthchecks, the
  # Traefik routing rules, the /api strip, the entrypoint migrations and the
  # seeds, all in one go. A green `compose config` has never once caught a
  # mistyped router rule.
  #
  # The body is `make smoke`, so there is exactly one definition of "does it
  # work" and a learner can run the same check on a laptop.
  # ---------------------------------------------------------------------------
  stack:
    name: live stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [quality, compose]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Materialise .env from the committed template
        run: cp .env.example .env

      # --wait blocks until every healthcheck passes and fails the step if one
      # never does, so a stack that never becomes healthy is a red build rather
      # than a confusing failure in the next step.
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Seed both databases
        run: make seed

      - name: Smoke test the running stack
        run: make smoke

      # Without this, a failure above is a red X with nothing behind it.
      - name: Dump container state and logs
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
